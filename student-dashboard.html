<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizloft — Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Quiz<span>loft</span><span class="role-badge">Student</span></div>
  <nav class="topnav">
    <a href="student-dashboard.html" class="active">Dashboard</a>
    <a href="leaderboard.html">Leaderboard</a>
    <button onclick="logout()">Log out</button>
  </nav>
</header>

<main>
  <div class="card">
    <h1 class="page-title">Hi, <span id="student-name">there</span> 👋</h1>
    <div class="sub">Pick a quiz below and start whenever you're ready.</div>
    <div id="quiz-list"><div class="empty">Loading quizzes…</div></div>
  </div>

  <div class="card">
    <h1 class="page-title" style="font-size:20px;">Your past results</h1>
    <div id="my-results"><div class="empty">Loading…</div></div>
  </div>
</main>

<footer class="foot">Quizloft · powered by Firebase</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/student.js"></script>
</body>
</html>
